<svg xmlns="http://www.w3.org/2000/svg" width="480" height="214" viewBox="0 0 480 214" role="img" aria-label="Network Port Scanner: A dependency-free Python 3 TCP port scanner that finds open ports and grabs each service's banner, covered by 10 automated unit tests.">
