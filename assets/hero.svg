    <text x="58" y="176" textLength="319.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#role0)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20.5" fill="#2DD4BF">Computer Engineering Student</text><text x="58" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B98B3" opacity="1"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0700;0.0850;0.1480;0.1600;1"/>Learning how systems work, from silicon up, at Mae Fah Luang University.</text><text x="58" y="176" textLength="285" lengthAdjust="spacingAndGlyphs" clip-path="url(#role1)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20.5" fill="#2DD4BF">Aspiring Network Engineer</text><text x="58" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B98B3" opacity="0"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2700;0.2850;0.3480;0.3600;1"/>Routing, switching and building labs that actually converge.</text><text x="58" y="176" textLength="296.40000000000003" lengthAdjust="spacingAndGlyphs" clip-path="url(#role2)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20.5" fill="#2DD4BF">Network Automation Builder</text><text x="58" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B98B3" opacity="0"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4700;0.4850;0.5480;0.5600;1"/>Letting Python and AI handle the repetitive CLI work.</text><text x="58" y="176" textLength="285" lengthAdjust="spacingAndGlyphs" clip-path="url(#role3)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20.5" fill="#2DD4BF">Security-Minded Developer</text><text x="58" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B98B3" opacity="0"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6700;0.6850;0.7480;0.7600;1"/>Building with spoofed mail, port scans and weak passwords in mind.</text><text x="58" y="176" textLength="182.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#role4)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20.5" fill="#2DD4BF">AI / ML Explorer</text><text x="58" y="207" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B98B3" opacity="0"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8700;0.8850;0.9480;0.9600;1"/>Putting Gemini, MediaPipe and computer vision to work in real projects.</text>
