<svg xmlns="http://www.w3.org/2000/svg" width="480" height="259" viewBox="0 0 480 259" role="img" aria-label="GNS3 Live Topology &amp; Resilience Dashboard (Network): A live dashboard that polls a running GNS3 lab through its REST API every 3 seconds, redraws the topology in the browser, and uses graph theory (bridge edges) to highlight single points of failure within seconds of a change. Tech: Python, Flask, GNS3, NetworkX, vis-network, REST API">
