    <text x="24" y="74" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="800" fill="#E6EDF3">GNS3 Live Topology &amp; Resilience</text><text x="24" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="800" fill="#E6EDF3">Dashboard</text><text x="24" y="128" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" fill="#8B98B3">A live dashboard that polls a running GNS3 lab through its REST</text><text x="24" y="147.5" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" fill="#8B98B3">API every 3 seconds, redraws the topology in the browser, and</text><text x="24" y="167" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" fill="#8B98B3">uses graph theory (bridge edges) to highlight single points of</text><text x="24" y="186.5" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" fill="#8B98B3">failure within seconds of a change.</text><rect x="24" y="214" width="58.2" height="23" rx="11.5" fill="#60A5FA" fill-opacity="0.1" stroke="#60A5FA" stroke-opacity="0.35"/><text x="53.1" y="229.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.2" fill="#60A5FA">Python</text><rect x="89.2" y="214" width="51.5" height="23" rx="11.5" fill="#60A5FA" fill-opacity="0.1" stroke="#60A5FA" stroke-opacity="0.35"/><text x="114.95" y="229.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.2" fill="#60A5FA">Flask</text><rect x="147.7" y="214" width="44.8" height="23" rx="11.5" fill="#60A5FA" fill-opacity="0.1" stroke="#60A5FA" stroke-opacity="0.35"/><text x="170.1" y="229.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.2" fill="#60A5FA">GNS3</text><rect x="19