<svg xmlns="http://www.w3.org/2000/svg" width="480" height="214" viewBox="0 0 480 214" role="img" aria-label="GNS3 Live Topology &amp; Resilience Dashboard: Polls a running GNS3 lab through its REST API every 3 seconds, redraws the topology and flags single points of failure with graph theory.">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="480" height="214" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="480" height="214" fill="#0A0F1C"/>
    <rect width="480" height="214" fill="url(#glow)"/>
    <rect width="480" height="2.5" fill="url(#bar)"/>
    <text x="24" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#2DD4BF">NETWORK MONITORING</text>
    <rect x="389.6" y="24" width="66.4" height="22" rx="11" fill="#8B98B3" fill-opacity="0.12" stroke="#8B98B3" stroke-opacity="0.5"/>
    <text x="422.8" y="39" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8B98B3">SOURCE</text>
    <text x="24" y="74" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#E6EDF3">GNS3 Live Topology &amp; Resilience Dashboard</text>
    <text x="24" y="104" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8B98B3">Polls a running GNS3 lab through its REST API every 3 seconds,</text><text x="24" y="124" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8B98B3">redraws the topology and flags single points of failure with</text><text x="24" y="144" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8B98B3">graph theory.</text>
    <g><rect x="24" y="170" width="59.400000000000006" height="24" rx="12" fill="#2DD4BF" fill-opacity="0.1" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="53.7" y="186" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#2DD4BF">Python</text></g><g><rect x="90.4" y="170" width="52.5" height="24" rx="12" fill="#2DD4BF" fill-opacity="0.1" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="116.65" y="186" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#2DD4BF">Flask</text></g><g><rect x="149.9" y="170" width="73.2" height="24" rx="12" fill="#2DD4BF" fill-opacity="0.1" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="186.5" y="186" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#2DD4BF">NetworkX</text></g><g><rect x="230.10000000000002" y="170" width="93.9" height="24" rx="12" fill="#2DD4BF" fill-opacity="0.1" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="277.05" y="186" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#2DD4BF">vis-network</text></g>
  </g>
  <rect x="0.75" y="0.75" width="478.5" height="212.5" rx="13.5" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
</svg>
