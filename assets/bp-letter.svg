<svg xmlns="http://www.w3.org/2000/svg" width="480" height="298.5" viewBox="0 0 480 298.5" role="img" aria-label="P-10 Letter — An Interactive Apology Game: Catch the falling hearts to open the envelope and the letter types itself out, while the “No” button keeps running from your cursor. BOM: HTML, CSS, JavaScript, Canvas API.">
