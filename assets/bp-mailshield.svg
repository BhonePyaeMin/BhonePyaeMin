<svg xmlns="http://www.w3.org/2000/svg" width="480" height="275.5" viewBox="0 0 480 275.5" role="img" aria-label="P-08 MailShield — Email Header Analyzer: Paste raw email headers and see SPF, DKIM and DMARC results, lookalike domains and mismatched links, even from screenshots via OCR. BOM: Python, Flask, Tesseract OCR.">
