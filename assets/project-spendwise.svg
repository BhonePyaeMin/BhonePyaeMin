<svg xmlns="http://www.w3.org/2000/svg" width="480" height="314.5" viewBox="0 0 480 314.5" role="img" aria-label="SpendWise — Secure Expense Tracker (Web, Cybersecurity): SpendWise is a personal finance web app I built to track daily spending on a low-spec laptop. Each user has a private account protected by BCrypt-hashed passwords, CSRF protection, and lockout after five failed logins. Every query is scoped to the signed-in user, and every change is written to an audit log. Tech: Java, Spring Boot, Spring Security, Thymeleaf, Spring Data JPA, H2 Database, BCrypt, JUnit 5, GitHub Actions, Audit Logging, Backup &amp; Restore">
