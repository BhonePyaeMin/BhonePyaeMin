e UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A9C6F2" opacity="0"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6700;0.6850;0.7480;0.7600;1"/>Building with spoofed mail, port scans and weak passwords in mind.</text><text x="100" y="214" textLength="179.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#r4)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="19" fill="#FDBA74">AI / ML EXPLORER</text><text x="100" y="242" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A9C6F2" opacity="0"><animate attributeName="opacity" dur="25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8700;0.8850;0.9480;0.9600;1"/>Putting Gemini, MediaPipe and computer vision to work in real projects.</text>
