<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="86" viewBox="0 0 1000 86" role="img" aria-label="Rack A — The tools I reach for most">
  <style>.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C3272"/><stop offset="1" stop-color="#082456"/></linearGradient>
    <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/></pattern>
    <clipPath id="paper"><rect width="1000" height="86" rx="10"/></clipPath></defs><g clip-path="url(#paper)"><rect width="1000" height="86" fill="url(#bgp)"/><rect width="1000" height="86" fill="url(#gmin)"/><rect width="1000" height="86" fill="url(#gmaj)"/>
    <circle cx="54" cy="43" r="21" fill="#082456" stroke="#EAF2FF" stroke-width="1.6"/>
    <circle cx="54" cy="43" r="27" fill="none" stroke="#FDBA74" stroke-width="1.2" stroke-dasharray="4 5" class="spin"/>
    <path d="M33 43H75" stroke="#EAF2FF" stroke-opacity="0.5"/>
    <text x="54" y="39" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#EAF2FF">D</text>
    <text x="54" y="57" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9" fill="#A9C6F2">05</text>
    <text x="96" y="42" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#EAF2FF">RACK A</text>
    <text x="96" y="63" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#A9C6F2">The tools I reach for most</text>
    <path d="M307.2 50H840" stroke="#A9C6F2" stroke-opacity="0.5" stroke-dasharray="2 5"/>
    <text x="966" y="54" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#A9C6F2">SHEET 05 / 08</text>
  
      <rect x="6" y="6" width="988" height="74" fill="none" stroke="#A9C6F2" stroke-opacity="0.45"/>
      <rect x="14" y="14" width="972" height="58" fill="none" stroke="#EAF2FF" stroke-opacity="0.8" stroke-width="1.6"/></g>
</svg>
