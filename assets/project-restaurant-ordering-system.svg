<svg xmlns="http://www.w3.org/2000/svg" width="480" height="265" viewBox="0 0 480 265" role="img" aria-label="Restaurant Ordering System (Web): A full-stack QR-code restaurant ordering system built with C# and Node.js — guests order and pay (PromptPay QR) from their phone, the kitchen sees orders instantly, and staff manage the menu, tables and bills from a live admin dashboard. Tech: C#, ASP.NET Core, SQLite, Node.js, Express, Socket.IO, HTML, CSS, JavaScript">
