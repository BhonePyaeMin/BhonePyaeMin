    <text x="24" y="74" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#E6EDF3">NetLab 3D — Network &amp; Security Simulator</text>
    <text x="24" y="104" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8B98B3">A first-person 3D networking lab in the browser: cable devices,</text><text x="24" y="124" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8B98B3">configure them in a Cisco-style CLI, then run security missions</text><text x="24" y="144" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8B98B3">against an IDS.</text>
