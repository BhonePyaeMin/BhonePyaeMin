      <text x="130.45" y="186" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#38BDF8">React</text></g><g><rect x="163.7" y="170" width="87" height="24" rx="12" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="207.2" y="186" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#38BDF8">TypeScript</text></g><g><rect x="257.7" y="170" width="45.6" height="24" rx="12" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.35"/>
