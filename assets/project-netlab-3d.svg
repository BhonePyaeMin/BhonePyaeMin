<svg xmlns="http://www.w3.org/2000/svg" width="480" height="214" viewBox="0 0 480 214" role="img" aria-label="NetLab 3D — Network &amp; Security Simulator: A first-person 3D networking lab in the browser: cable devices, configure them in a Cisco-style CLI, then run security missions against an IDS.">
