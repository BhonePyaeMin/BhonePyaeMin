<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278.5" viewBox="0 0 480 278.5" role="img" aria-label="NetLab 3D — Network &amp; Cybersecurity Simulator (Network, Cybersecurity): A browser-based, first-person 3D networking lab. Cable up routers, switches and PCs, configure them through a Cisco-style CLI (single-area OSPF, RIP, NAT, ACLs, VLANs, DHCP), then complete security missions (ARP spoofing, MAC flooding, port scans) detected by a built-in simulated IDS. Tech: Three.js, React, TypeScript, Vite, Cisco-style CLI">
