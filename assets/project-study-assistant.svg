<svg xmlns="http://www.w3.org/2000/svg" width="480" height="259" viewBox="0 0 480 259" role="img" aria-label="AI-Based Study Assistant (AI/ML, Web): A Flask web app where students chat with a Gemini-powered AI tutor, turn notes or PDFs into quizzes and flashcards, plan study tasks, and track progress on a personal dashboard. Tech: AI/ML, Python, HTML, CSS, JavaScript, Gemini API, Flask, PostgreSQL/SQLite, Docker">
